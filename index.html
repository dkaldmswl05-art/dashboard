<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>재고·매출 대시보드</title>
<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzOWDLhtGqHUHTdoZkxGCjUkUsdf3x_tbubxCfuU0NvzOL1qzhNTfuC4CKooZsRFY-G8g/exec";
</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg     : #0b0e14; --surface: #131720; --card  : #1a2030;
  --border : #252d3d; --accent : #4f8ef7; --accent2: #34d399;
  --accent3: #f59e0b; --accent4: #f87171;
  --text   : #e2e8f0; --muted  : #64748b;
  --radius : 14px; --shadow: 0 4px 24px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
#loading{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.spinner{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{color:var(--muted);font-size:.9rem}
#app{display:none}
header{position:sticky;top:0;z-index:100;background:rgba(11,14,20,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:10px}
header h1 span.logo{width:28px;height:28px;background:var(--accent);border-radius:7px;display:grid;place-items:center;font-size:.75rem;font-weight:900;color:#fff}
#last-updated{font-size:.75rem;color:var(--muted);font-family:'JetBrains Mono',monospace}
main{max-width:1400px;margin:0 auto;padding:28px 24px 60px;display:grid;gap:24px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent-color,var(--accent));border-radius:var(--radius) var(--radius) 0 0}
.kpi-card:hover{transform:translateY(-3px)}
.kpi-label{font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.kpi-value{font-size:1.7rem;font-weight:900;font-family:'JetBrains Mono',monospace;line-height:1}
.kpi-sub{font-size:.75rem;color:var(--muted);margin-top:6px}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:20px}
.chart-grid.wide{grid-template-columns:1fr}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.card-title{font-size:.9rem;font-weight:700}
.card-badge{font-size:.68rem;padding:3px 9px;border-radius:99px;font-family:'JetBrains Mono',monospace;background:rgba(79,142,247,.12);color:var(--accent);border:1px solid rgba(79,142,247,.25)}
.chart-wrap{position:relative;height:260px}
.chart-wrap.tall{height:320px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.82rem}
thead th{text-align:left;padding:8px 12px;font-size:.68rem;letter-spacing:.07em;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr{border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s}
tbody tr:hover{background:rgba(255,255,255,.03)}
tbody td{padding:9px 12px;white-space:nowrap}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.68rem;font-weight:600;font-family:'JetBrains Mono',monospace}
.badge-ok{background:rgba(52,211,153,.12);color:var(--accent2)}
.badge-warn{background:rgba(245,158,11,.12);color:var(--accent3)}
.badge-danger{background:rgba(248,113,113,.12);color:var(--accent4)}
.badge-info{background:rgba(79,142,247,.12);color:var(--accent)}
#error-banner{display:none;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);border-radius:var(--radius);padding:14px 18px;color:var(--accent4);font-size:.85rem}
@media(max-width:900px){.chart-grid{grid-template-columns:1fr}.kpi-row{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <p>데이터 불러오는 중…</p>
</div>
<div id="app">
  <header>
    <h1><span class="logo">재</span> 재고 · 매출 대시보드</h1>
    <span id="last-updated">—</span>
  </header>
  <main>
    <div id="error-banner"></div>
    <div class="kpi-row" id="kpi-row"></div>
    <div class="chart-grid wide">
      <div class="card">
        <div class="card-header"><span class="card-title">📈 일별 매출 추이</span><span class="card-badge">Sales Trend</span></div>
        <div class="chart-wrap tall"><canvas id="chartTrend"></canvas></div>
      </div>
    </div>
    <div class="chart-grid">
      <div class="card">
        <div class="card-header"><span class="card-title">🗂 카테고리별 매출</span><span class="card-badge">Category</span></div>
        <div class="chart-wrap"><canvas id="chartCategory"></canvas></div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">📡 판매채널별 매출</span><span class="card-badge">Channel</span></div>
        <div class="chart-wrap"><canvas id="chartChannel"></canvas></div>
      </div>
    </div>
    <div class="chart-grid">
      <div class="card">
        <div class="card-header"><span class="card-title">🏆 제품별 매출 Top 10</span><span class="card-badge">Products</span></div>
        <div class="chart-wrap tall"><canvas id="chartProducts"></canvas></div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">🗺 지역별 매출</span><span class="card-badge">Region</span></div>
        <div class="chart-wrap"><canvas id="chartRegion"></canvas></div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">📦 재고 현황</span><span class="card-badge">Inventory</span></div>
      <div class="table-wrap" id="tbl-inventory"></div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">🧾 최근 매출 (최신 20건)</span><span class="card-badge">Recent Sales</span></div>
      <div class="table-wrap" id="tbl-sales"></div>
    </div>
  </main>
</div>
<script>
const fmt  = n => new Intl.NumberFormat('ko-KR').format(Math.round(n));
const fmtW = n => fmt(n) + ' 원';
const C = ['#4f8ef7','#34d399','#f59e0b','#f87171','#a78bfa','#38bdf8','#fb923c','#e879f9','#84cc16','#2dd4bf'];
Chart.defaults.color = '#64748b';
Chart.defaults.borderColor = '#252d3d';
Chart.defaults.font.family = "'Noto Sans KR', sans-serif";
Chart.defaults.font.size = 11;
function renderKPI(s) {
  const cards = [
    {label:'총 매출액',    value:fmtW(s.totalRevenue),    sub:'주문 '+fmt(s.totalOrders)+'건', color:'#4f8ef7'},
    {label:'총 판매수량',  value:fmt(s.totalQty)+'개',     sub:'전체 출고 기준',                color:'#34d399'},
    {label:'평균 주문금액',value:fmtW(s.avgOrderValue),   sub:'주문건당',                      color:'#f59e0b'},
    {label:'총 입고금액',  value:fmtW(s.totalInbound),    sub:'입고 금액 기준',                color:'#a78bfa'},
    {label:'총 출고건수',  value:fmt(s.totalOutbound)+'건',sub:'전 유형 포함',                 color:'#38bdf8'},
    {label:'재주문 필요',  value:s.reorderNeeded+'품목',   sub:'안전재고 미달',                 color:s.reorderNeeded>0?'#f87171':'#34d399'},
  ];
  document.getElementById('kpi-row').innerHTML = cards.map(c=>`
    <div class="kpi-card" style="--accent-color:${c.color}">
      <div class="kpi-label">${c.label}</div>
      <div class="kpi-value" style="color:${c.color}">${c.value}</div>
      <div class="kpi-sub">${c.sub}</div>
    </div>`).join('');
}
function lineChart(id,labels,values){
  new Chart(document.getElementById(id),{type:'line',data:{labels,datasets:[{label:'매출',data:values,borderColor:'#4f8ef7',backgroundColor:'rgba(79,142,247,.15)',borderWidth:2.5,pointRadius:3,tension:.4,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+fmtW(ctx.raw)}}},scales:{x:{grid:{color:'#1e2736'},ticks:{maxTicksLimit:10}},y:{grid:{color:'#1e2736'},ticks:{callback:v=>fmt(v/10000)+'만'}}}}});
}
function barChart(id,labels,values,horizontal=false){
  new Chart(document.getElementById(id),{type:'bar',data:{labels,datasets:[{data:values,backgroundColor:C.slice(0,values.length).map(c=>c+'cc'),borderColor:C.slice(0,values.length),borderWidth:1.5,borderRadius:6}]},options:{indexAxis:horizontal?'y':'x',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+fmtW(ctx.raw)}}},scales:{x:{grid:{color:'#1e2736'},ticks:{callback:horizontal?(v=>fmt(v/10000)+'만'):undefined}},y:{grid:{color:'#1e2736'},ticks:{callback:!horizontal?(v=>fmt(v/10000)+'만'):undefined}}}}});
}
function doughnutChart(id,labels,values){
  new Chart(document.getElementById(id),{type:'doughnut',data:{labels,datasets:[{data:values,backgroundColor:C.slice(0,values.length).map(c=>c+'cc'),borderColor:'#131720',borderWidth:3}]},options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{position:'right',labels:{boxWidth:12,padding:14}},tooltip:{callbacks:{label:ctx=>' '+fmtW(ctx.raw)}}}}});
}
function renderInventoryTable(inv){
  const badge=s=>s==='정상'?`<span class="badge badge-ok">${s}</span>`:s==='주의'?`<span class="badge badge-warn">${s}</span>`:`<span class="badge badge-danger">${s}</span>`;
  document.getElementById('tbl-inventory').innerHTML=`<table><thead><tr><th>제품코드</th><th>제품명</th><th>카테고리</th><th>총입고</th><th>총출고</th><th>현재재고</th><th>안전재고</th><th>상태</th></tr></thead><tbody>${inv.map(r=>`<tr><td style="font-family:'JetBrains Mono',monospace;color:var(--muted)">${r.code}</td><td style="font-weight:600">${r.name}</td><td>${r.category}</td><td>${fmt(r.inbound)}</td><td>${fmt(r.outbound)}</td><td style="font-family:'JetBrains Mono',monospace;font-weight:700">${fmt(r.current)}</td><td style="color:var(--muted)">${fmt(r.safety)}</td><td>${badge(r.status)}</td></tr>`).join('')}</tbody></table>`;
}
function renderSalesTable(sales){
  document.getElementById('tbl-sales').innerHTML=`<table><thead><tr><th>주문번호</th><th>주문일자</th><th>제품명</th><th>카테고리</th><th>수량</th><th>단가</th><th>할인율</th><th>판매금액</th><th>지역</th><th>판매채널</th><th>담당자</th></tr></thead><tbody>${sales.map(r=>{const disc=Number(r['할인율']||0);const discBadge=disc>0?`<span class="badge badge-warn">${(disc*100).toFixed(0)}%</span>`:`<span class="badge badge-info">0%</span>`;return`<tr><td style="font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:.75rem">${r['주문번호']}</td><td style="font-family:'JetBrains Mono',monospace;font-size:.78rem">${r['주문일자']}</td><td style="font-weight:600">${r['제품명']}</td><td>${r['카테고리']||''}</td><td>${fmt(r['수량']||0)}</td><td>${fmtW(r['단가']||0)}</td><td>${discBadge}</td><td style="font-weight:700;color:var(--accent2)">${fmtW(r['판매금액']||0)}</td><td>${r['지역']||''}</td><td>${r['판매채널']||''}</td><td style="color:var(--muted)">${r['담당자']||''}</td></tr>`;}).join('')}</tbody></table>`;
}
async function init(){
  try{
    const res=await fetch(WEB_APP_URL+'?action=all');
    const json=await res.json();
    if(json.status!=='ok') throw new Error(json.message||'데이터 오류');
    const d=json.data;
    renderKPI(d.summary);
    lineChart('chartTrend',d.salesTrend.map(r=>r.date),d.salesTrend.map(r=>r.amount));
    barChart('chartCategory',d.salesByCategory.map(r=>r.category),d.salesByCategory.map(r=>r.amount));
    doughnutChart('chartChannel',d.salesByChannel.map(r=>r.channel),d.salesByChannel.map(r=>r.amount));
    barChart('chartProducts',d.topProducts.map(r=>r.name),d.topProducts.map(r=>r.amount),true);
    barChart('chartRegion',d.salesByRegion.map(r=>r.region),d.salesByRegion.map(r=>r.amount));
    renderInventoryTable(d.inventorySummary);
    renderSalesTable(d.recentSales);
    document.getElementById('last-updated').textContent='업데이트: '+new Date().toLocaleTimeString('ko-KR');
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='block';
  }catch(err){
    showError('데이터 로딩 실패: '+err.message);
  }
}
function showError(msg){
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='block';
  const b=document.getElementById('error-banner');
  b.textContent=msg;b.style.display='block';
}
window.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
